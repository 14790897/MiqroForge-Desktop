# 路径解析语义（issue #806 文档声明）
# 所有 office 工具（create_docx / create_pptx / create_xlsx / create_pdf 及读写别名）
# 的文件名参数由 miqi/documents/path_utils.py 统一解析。
#
# 规则：
# - 相对路径的基准是当前会话的专属文件目录（会话 files 根）
# - 若路径以会话目录前缀开头（从工作区根视角书写的完整相对路径），
#   解析器会自动剥离该前缀，不会产生目录嵌套（修复 issue #806 的嵌套落盘问题）
# - 指向其他会话目录的路径会被拒绝（会话隔离）
# - 成功创建后返回实际落盘路径
# - create_pdf 的 content_path（可选）读取源文件：除上述边界外，额外接受
#   tools.auto_user_dirs/_user_roots（#821 口径）授权的用户目录，与 ReadFileTool 一致；
#   未授权目录一律拒绝（fail-closed，无读边界放宽）
#
# 详细实现见 miqi/documents/path_utils.py 模块文档。
path_semantics:
  relative_base: "当前会话的专属文件目录（会话 files 根）"
  prefix_stripping: "以会话目录前缀开头的路径自动剥离前缀，避免嵌套"
  cross_session: "指向其他会话目录的路径会被拒绝（会话隔离）"
  return_value: "成功创建后返回实际落盘路径"
