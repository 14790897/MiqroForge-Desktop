appId: com.miqi.desktop
productName: MiQroForge Desktop
directories:
  output: ../../dist-new
files:
  - out/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: src/renderer/assets/icon.ico
    to: icon.ico
  - from: src/renderer/assets/icon.icns
    to: icon.icns
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: src/renderer/assets/icon.ico
  extraResources:
    - from: ../../dist/miqi-bridge.exe
      to: miqi-bridge.exe
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: src/renderer/assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: platform/entitlements.mac.plist
  entitlementsInherit: platform/entitlements.mac.inherit.plist
  darkModeSupport: true
  extraResources:
    - from: ../../dist/miqi-bridge
      to: miqi-bridge
nsis:
  perMachine: true
  oneClick: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
dmg:
  # DMG 挂载协议页（SLA）不启用：build/ 下 license_*.txt 会被 dmg-builder
  # 按约定拾取，中文文本无法用 mac_roman 编码导致打包失败。macOS 用户由
  # 应用内首次启动隐私协议确认门兜底（#837）。
  license: null
publish:
  - provider: generic
    url: ""
