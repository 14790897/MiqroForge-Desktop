appId: com.miqi.desktop
productName: MiQroForge Desktop
directories:
  output: ../../dist-new
files:
  - out/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: src/renderer/assets/icon.ico
    to: icon.ico
  - from: src/renderer/assets/icon.icns
    to: icon.icns
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: src/renderer/assets/icon.ico
  extraResources:
    - from: ../../dist/miqi-bridge.exe
      to: miqi-bridge.exe
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: src/renderer/assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: platform/entitlements.mac.plist
  entitlementsInherit: platform/entitlements.mac.inherit.plist
  darkModeSupport: true
  extraResources:
    - from: ../../dist/miqi-bridge
      to: miqi-bridge
nsis:
  # 按用户安装（不设 perMachine）：免 UAC，存量 %LOCALAPPDATA%\Programs 副本可原地
  # 覆盖升级；perMachine 模式要求管理员且固定装 Program Files，会切断更新链路（#1124）。
  oneClick: false
  # #1176：开启目录页，允许自定义安装路径（默认值仍为按用户路径，免 UAC 语义不变）。
  allowToChangeInstallationDirectory: true
  # 目录页校验脚本：按用户模式下拦截需管理员权限的系统目录（见 build/installer.nsh）。
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
dmg:
  # DMG 挂载协议页（SLA）不启用：build/ 下 license_*.txt 会被 dmg-builder
  # 按约定拾取，中文文本无法用 mac_roman 编码导致打包失败。macOS 用户由
  # 应用内首次启动隐私协议确认门兜底（#837）。
  license: null
publish:
  - provider: generic
    url: ""
