name: Python Runtime Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "miqi/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-tests.yml"
      - "apps/desktop/tests/e2e/**"
  pull_request:
    paths:
      - "miqi/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-tests.yml"
      - "apps/desktop/tests/e2e/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run ruff lint
        run: uv run ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # 实测 pytest 步骤 ubuntu 348-375s、windows 475-512s，45 分钟是 4.5 倍余量。
    # 此前完全没有上限，已经真实烧掉过两次 6 小时 runner（job 105446711757
    # 2026-09-18、job 106055400629 2026-09-20），都被 GitHub 的 360 分钟默认
    # 上限硬杀，且因为 pytest -q 只打点而定位不了卡在哪。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run portable and subprocess tests
        run: uv run pytest -q -m "not sandbox and not wsl" --tb=short

  # bwrap(ubuntu) job 已删除：ubuntu-latest 上 `bwrap --ro-bind / / /bin/true`
  # 恒为失败（setting up uid map: Permission denied），`Run sandbox tests` 步骤
  # 在所有记录里都是 skipped，整个 job 19 秒跑完——却带着一条 sudo apt-get
  # install 和它自己的 20 分钟上限。删除零覆盖损失：同一批标记
  # （`-m "sandbox and bwrap"`）在下面的 wsl-sandbox job 里照跑。

  wsl-sandbox:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install WSL Ubuntu distro
        shell: pwsh
        run: |
          Write-Host "Installing WSL Ubuntu..."
          wsl --install -d Ubuntu --no-launch
          Write-Host "Initializing WSL user..."
          wsl -d Ubuntu -- bash -c "id -u miqi 2>/dev/null || useradd -m miqi"
          wsl -d Ubuntu -- bash -c "mkdir -p /tmp/miqi-sandboxes && chmod 777 /tmp/miqi-sandboxes"
          Write-Host "WSL distro list:"
          wsl -l -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run WSL sandbox tests (auto-install)
        run: uv run pytest -q -m "wsl" --tb=short
      - name: Run WSL sandbox tests (bwrap integration)
        run: uv run pytest -q -m "sandbox and bwrap" --tb=short

  wsl-e2e:
    concurrency:
      group: wsl-e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    # 冷 runner 预算：one-click-install(15) + WSL 回退安装 + 清理 + 沙箱 E2E(20)
    # + Windows-only E2E(10，见 #1196)——30 分钟连续多次被砍（#891/#875 CI 实测），
    # 先放宽到 45，#1196 加入最后一步后再放宽到 55
    timeout-minutes: 55
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Build environment (before WSL — MiQroForge will install it) ────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          npm ci
          pip install uv
          cd ../.. && uv sync

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        id: build
        run: npm run build

      - name: Generate config.json
        shell: bash
        run: |
          mkdir -p ~/.forge
          cat > ~/.forge/config.json << 'CONFEOF'
          {
            "providers": {
              "siliconflow": {
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "apiBase": "${{ secrets.DEEPSEEK_API_BASE }}",
                "extraHeaders": null
              }
            },
            "agents": {
              "defaults": {
                "model": "deepseek-v4-pro",
                "maxTokens": 8000,
                "temperature": 0.1,
                "maxToolIterations": 10,
                "runtime": "app_server"
              },
              "commandApproval": { "enabled": false }
            },
            "tools": {
              "web": {
                "search": { "provider": "brave", "apiKey": "${{ secrets.BRAVE_API_KEY }}", "maxResults": 3 },
                "fetch": { "provider": "builtin" }
              },
              "exec": { "timeout": 30, "envPassthrough": [] }
            }
          }
          CONFEOF

      # ── E2E: MiQroForge auto-installs WSL via installAndProvision ───────
      - name: Run WSL one-click-install E2E (MiQroForge auto-installs WSL)
        if: steps.build.outcome == 'success'
        run: |
          npx playwright test --config=playwright.config.ts --project=electron wsl-one-click-install.spec.ts --workers=1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE }}
        # 冷 runner 上 MiQroForge 自动装 WSL 依赖（apt 等）可能超过 10 分钟
        # （#891 CI 实测：连续四次卡 10 分钟上限/超时被砍）——放宽到 15 分钟
        timeout-minutes: 15

      # ── Fallback: ensure WSL + sandbox distro ready ──────────────
      # if: always()：one-click-install 步骤失败（冷 runner 超时）不能跳过
      # WSL 准备——否则沙箱 E2E 在无 WSL 状态下硬跑（#891 CI 实测修正，
      # 与 #875 4b4672b 同一修复）
      - name: Install WSL Ubuntu distro (fallback)
        if: always()
        shell: pwsh
        run: |
          Write-Host "Installing WSL Ubuntu..."
          wsl --install -d Ubuntu --no-launch
          Write-Host "Initializing WSL user..."
          wsl -d Ubuntu -- bash -c "id -u miqi 2>/dev/null || useradd -m miqi"
          wsl -d Ubuntu -- bash -c "mkdir -p /tmp/miqi-sandboxes && chmod 777 /tmp/miqi-sandboxes"
          Write-Host "WSL distro list:"
          wsl -l -v

      - name: Clean sandbox state (force auto-export)
        if: always()
        shell: pwsh
        run: |
          Write-Host "Removing bubblewrap from Ubuntu..."
          wsl -d Ubuntu -u root -- bash -c "apt-get remove -y -qq bubblewrap 2>/dev/null; echo done"
          Write-Host "Unregistering AIShadowSandbox if exists..."
          wsl --unregister AIShadowSandbox 2>$null; echo "cleaned"
          Write-Host "WSL after cleanup:"
          wsl -l -v

      # ── Sandbox E2E (WSL must be ready after our tests) ──────────
      - name: Run sandbox E2E tests (WSL)
        if: always()
        continue-on-error: true  # known flaky — don't fail the job
        run: |
          npx playwright test --config=playwright.config.ts --project=electron sandbox-exec.spec.ts session-key-mapping.spec.ts sandbox-toggle.spec.ts --workers=1
        env:
          MIQI_RUN_SANDBOX_E2E: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: ${{ secrets.DEEPSEEK_API_BASE }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        timeout-minutes: 20

      # ── WSL 状态监控的磁盘对账（#1157）─────────────────────────────
      # 纯 UI + 主进程换算，不需要 LLM / 沙箱；单独一步是为了失败可见
      # （上面那步 sandbox E2E 带 continue-on-error）。
      - name: Run WSL disk accounting E2E (#1157)
        if: always() && steps.build.outcome == 'success'
        run: |
          npx playwright test --config=playwright.config.ts --project=electron issue-1157-wsl-disk-accounting.spec.ts --workers=1
        timeout-minutes: 10

      # ── Windows-only 语义的 E2E（#1196）────────────────────────────
      # 这两个 spec 是文件级 `process.platform !== 'win32'` 守卫：ubuntu/macOS 的
      # 全量套件都跑不到，Windows 侧此前只按名字跑 5 个，于是它们从未被执行过
      # （#1196 的零覆盖清单）。两者不依赖 LLM / WSL 沙箱（issue-1171 把
      # `wsl:check` 换成桩结果，open-external-path-security 只走 files IPC），
      # 所以不设 continue-on-error —— 要的就是这两条路径改坏了有红灯。
      # 清单与守卫：apps/desktop/tests/e2e/CI-COVERAGE.md + npm test。
      - name: Run Windows-only E2E (#1196)
        if: always() && steps.build.outcome == 'success'
        run: |
          npx playwright test --config=playwright.config.ts --project=electron issue-1171-wsl-platform-guidance.spec.ts open-external-path-security.spec.ts --workers=1
        timeout-minutes: 10

      - name: Upload Playwright report (WSL E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wsl-e2e
          path: apps/desktop/test-results/
          retention-days: 7