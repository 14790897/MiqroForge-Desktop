name: WeCom Notify

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' && !contains(fromJson('["coderabbitai[bot]","dependabot[bot]","github-actions[bot]"]'), github.actor) }}
    steps:
      - name: Send to WeCom
        env:
          WECOM_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          EVENT="${{ github.event_name }}"
          SENDER="${{ github.actor }}"
          TITLE=$(jq -r '(.issue.title // .pull_request.title // "")' "$GITHUB_EVENT_PATH")
          URL=$(jq -r '(.comment.html_url // .issue.html_url // .pull_request.html_url // "")' "$GITHUB_EVENT_PATH")
          # 只有评论通知带正文；PR/issue 只带标题，避免刷屏
          if [ "$EVENT" = "issue_comment" ]; then
            BODY_RAW=$(jq -r '(.comment.body // "")' "$GITHUB_EVENT_PATH")
          else
            BODY_RAW=""
          fi
          # semantic-release 发布通知评论由 RELEASE_TOKEN（本人 PAT）发出，
          # 用户名过滤无效，按内容特征跳过
          if printf '%s' "$BODY_RAW" | grep -qE ':tada:.*(resolved in version|included in version)'; then
            echo "release notification comment, skip"
            exit 0
          fi
          # 评论正文只保留前 100 字，避免刷屏
          BODY=$(printf '%s' "$BODY_RAW" | jq -Rrs '.[0:100]')
          if [ "$BODY" != "$BODY_RAW" ]; then
            HINT="$(printf '\n…（内容过长，已截断，全文见链接）')"
          else
            HINT=""
          fi
          jq -n \
            --arg ev "$EVENT" \
            --arg sender "$SENDER" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg body "$BODY" \
            --arg hint "$HINT" \
            '{msgtype:"markdown", markdown:{content:("> 事件: " + $ev + "\n> 发起人: " + $sender + "\n> 标题: " + $title + "\n> 链接: [点此查看](" + $url + ")" + (if $body != "" then "\n\n" else "" end) + $body + $hint)}}' > msg.json
          curl -s "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
            -H "Content-Type: application/json" -d @msg.json
