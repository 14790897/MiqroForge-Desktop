name: PR 模板校验

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 PR 模板是否完整填写
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // 去掉 HTML 注释（<!-- xxx -->）
            const withoutComments = body.replace(/<!--[\s\S]*?-->/g, '').trim();

            // 取 `## 标题` 到下一个 `## 标题` 之间的正文。
            // 空节时正则会把下一个标题行吸进来，用 startsWith('## ') 拦掉，避免空节误判为已填写。
            const sectionText = (label) => {
              const m = withoutComments.match(
                new RegExp(`## ${label}\\s*\\n+([\\s\\S]*?)(?=\\n## |\\n##$|$)`)
              );
              const text = m ? m[1].trim() : '';
              return text.startsWith('## ') ? '' : text;
            };

            const checks = [
              {
                label: '类型',
                // 至少勾选了一项
                check: () => /\[x\]/.test(withoutComments),
              },
              {
                label: '变更概述',
                check: () => sectionText('变更概述').length > 0,
              },
              {
                label: '背景/问题',
                check: () => sectionText('背景/问题').length > 0,
              },
              {
                label: '变更内容',
                check: () => sectionText('变更内容').length > 0,
              },
              {
                label: '日志/验证证据',
                // 节内有非空内容即可，不强制代码块或图片格式
                check: () => sectionText('日志/验证证据').length > 0,
              },
              {
                label: '测试情况',
                check: () => sectionText('测试情况').length > 0,
              },
              {
                label: '截图',
                check: () => sectionText('截图').length > 0,
              },
            ];

            const failures = checks.filter(c => !c.check()).map(c => c.label);

            if (failures.length > 0) {
              core.setFailed(
                `PR 模板以下必填节为空，请补充：\n${failures.map(f => `  - ${f}`).join('\n')}` +
                '\n\n不允许空白节，必须有日志/证据。'
              );
            } else {
              console.log('✅ PR 模板填写完整');
            }
