name: Desktop CI

on:
  push:
    branches: [develop]
  pull_request_target:
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 快速检查 — TypeScript + 单元测试 + mock smoke (无 API key)
  # ────────────────────────────────────────────────────────────
  quick:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-quick
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Unit tests (vitest)
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Mock smoke tests (Playwright)
        run: npx playwright test --config=playwright.config.ts --project=smoke --quiet
        continue-on-error: true  # flaky in headless, don't block

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 2: Electron E2E — 完整桌面应用 + 真实 bridge + LLM
  # ────────────────────────────────────────────────────────────
  electron-e2e:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-electron-e2e
      cancel-in-progress: true
    # Fork PRs only get secrets if the author is a collaborator.
    # if: |
    #   github.event_name == 'push' ||
    #   github.event_name == 'workflow_dispatch' ||
    #   github.event.pull_request.head.repo.full_name == github.repository ||
    #   contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install uv
          uv sync
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Generate config.json
        run: |
          mkdir -p ~/.miqi
          cat > ~/.miqi/config.json << 'CONFEOF'
          {
            "providers": {
              "siliconflow": {
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "apiBase": "${{ secrets.DEEPSEEK_API_BASE }}",
                "extraHeaders": null
              }
            },
            "agents": {
              "defaults": {
                "model": "deepseek-v4-pro",
                "maxTokens": 8000,
                "temperature": 0.1,
                "maxToolIterations": 10,
                "runtime": "app_server"
              },
              "commandApproval": { "enabled": false }
            },
            "tools": {
              "web": {
                "search": {
                  "provider": "brave",
                  "apiKey": "${{ secrets.BRAVE_API_KEY }}",
                  "maxResults": 3
                },
                "fetch": { "provider": "builtin" }
              },
              "exec": { "timeout": 30, "envPassthrough": [] }
            }
          }
          CONFEOF

      - name: AI connectivity probe — fail fast if provider unreachable
        run: |
          xvfb-run --auto-servernum \
            npx playwright test --config=playwright.config.ts --project=electron \
            --grep "AI Connectivity"
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Run Electron E2E
        run: |
          xvfb-run --auto-servernum \
            npx playwright test --config=playwright.config.ts --project=electron
        timeout-minutes: 30
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Upload Playwright report (E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: apps/desktop/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 3: macOS Electron E2E — 完整 macOS 桌面应用 + bridge + LLM
  # ────────────────────────────────────────────────────────────
  macos-e2e:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-macos-e2e
      cancel-in-progress: true
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install uv
          uv sync

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Generate config.json
        run: |
          mkdir -p ~/.miqi
          cat > ~/.miqi/config.json << 'CONFEOF'
          {
            "providers": {
              "siliconflow": {
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "apiBase": "${{ secrets.DEEPSEEK_API_BASE }}",
                "extraHeaders": null
              }
            },
            "agents": {
              "defaults": {
                "model": "deepseek-v4-pro",
                "maxTokens": 8000,
                "temperature": 0.1,
                "maxToolIterations": 10,
                "runtime": "app_server"
              },
              "commandApproval": { "enabled": false }
            },
            "tools": {
              "web": {
                "search": {
                  "provider": "brave",
                  "apiKey": "${{ secrets.BRAVE_API_KEY }}",
                  "maxResults": 3
                },
                "fetch": { "provider": "builtin" }
              },
              "exec": { "timeout": 30, "envPassthrough": [] }
            }
          }
          CONFEOF

      - name: AI connectivity probe (macOS) — fail fast if provider unreachable
        run: |
          npx playwright test --config=playwright.config.ts --project=electron \
            --grep "AI Connectivity"
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Run Electron E2E (macOS)
        # --workers=2: macos-latest runners (3 vCPU) can't sustain 4 parallel
        # Electron instances + LLM calls — overloaded runners cause intermittent
        # failures at random spec points (actionability misjudgements, slow
        # first sessions.list, sandbox timeouts).  Halving parallelism made the
        # suite stable without changing test semantics.
        #
        # --grep-invert also drops describe blocks that burn the most wall-clock
        # on macOS so the job stays under ~15 min:
        #   - sandbox-only suites (Sandbox Toggle / Sandbox toggle ready /
        #     Workspace Switch E2E (Sandbox ON)): no bubblewrap on macOS, so they
        #     wait waitForSandboxReady(300s) + LLM retries before failing.
        #   - heaviest LLM suites (Native Electron E2E / Feedback Page E2E /
        #     Execution Policy E2E): 34 long streaming tests that double the run.
        # Both are fully covered by the Linux electron-e2e job, which runs the
        # whole suite.
        run: |
          npx playwright test --config=playwright.config.ts --project=electron \
            --grep-invert "Sandbox Exec|Sandbox Toggle|Sandbox toggle ready|Workspace Switch E2E \(Sandbox ON\)|session-key-mapping|PPTX Generator|Native Electron E2E|Feedback Page E2E|Execution Policy E2E" \
            --workers=2
        timeout-minutes: 45
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Upload Playwright report (macOS E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos-e2e
          path: apps/desktop/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # macOS 打包（dmg/zip）不在这里跑：每个 PR 都起 macos runner 成本高，
  # 产物也没有下游消费方。发版时由 release.yml 的 build-mac 构建并上传 release。
  # ────────────────────────────────────────────────────────────
