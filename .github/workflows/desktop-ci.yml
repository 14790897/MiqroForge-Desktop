name: Desktop CI

on:
  push:
    branches: [develop]
  pull_request_target:
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: 快速检查 — TypeScript + 单元测试 + mock smoke (无 API key)
  # ────────────────────────────────────────────────────────────
  quick:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-quick
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 最小权限：本 job 会跑 PR 检出代码（npm test / mock smoke），只保留读代码 + 上传失败报告
    # 所需的 actions:write，别继承 pull_request_target 的默认可写 token（zizmor excessive-permissions）。
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # 本 job 会执行 PR 检出的代码；checkout 默认把 job token 写进 .git/config，
          # 那等于把带 actions:write 的凭据放到 PR 代码手里。不持久化，后续步骤也不需要它。
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Unit tests (vitest)
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Mock smoke tests (Playwright)
        # 作为门禁跑：smoke 覆盖渲染层启动路径（协议门 / 登录门 / 主界面）。
        # 此前 continue-on-error 期间，mock 缺 window.miqi.app 让 ChatConsole
        # 挂载即崩，65/75 用例静默失效（#1095 修复时才暴露）。瞬时抖动由
        # playwright.config.ts 的全局 CI retries=2 兜住。
        run: npx playwright test --config=playwright.config.ts --project=smoke --quiet

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 2: Electron E2E — 完整桌面应用 + 真实 bridge + LLM
  # ────────────────────────────────────────────────────────────
  electron-e2e:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-electron-e2e
      cancel-in-progress: true
    # Fork PRs only get secrets if the author is a collaborator.
    # if: |
    #   github.event_name == 'push' ||
    #   github.event_name == 'workflow_dispatch' ||
    #   github.event.pull_request.head.repo.full_name == github.repository ||
    #   contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    # E2E job 检出并执行 PR head 的测试代码，因此只保留最小只读权限 + artifact 写入。
    # release asset 上传移到后面不检出 PR head 的独立 job，避免 PR 控制代码接触 contents:write。
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # 本 job 在凭据落盘后执行 PR 检出的代码（spec / 构建脚本），checkout 默认会把 job
          # token 写进 .git/config —— 别把它交给 PR 代码（CodeRabbit 安全评审 #1107）。
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install uv
          uv sync
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Generate config.json
        run: |
          mkdir -p ~/.miqi
          cat > ~/.miqi/config.json << 'CONFEOF'
          {
            "providers": {
              "siliconflow": {
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "apiBase": "${{ secrets.DEEPSEEK_API_BASE }}",
                "extraHeaders": null
              }
            },
            "agents": {
              "defaults": {
                "model": "deepseek-v4-pro",
                "maxTokens": 8000,
                "temperature": 0.1,
                "maxToolIterations": 10,
                "runtime": "app_server"
              },
              "commandApproval": { "enabled": false }
            },
            "tools": {
              "web": {
                "search": {
                  "provider": "brave",
                  "apiKey": "${{ secrets.BRAVE_API_KEY }}",
                  "maxResults": 3
                },
                "fetch": { "provider": "builtin" }
              },
              "exec": { "timeout": 30, "envPassthrough": [] }
            }
          }
          CONFEOF

      - name: AI connectivity probe — fail fast if provider unreachable
        # --reporter=list：命令行 reporter 会整组替换 config 里的 html+json（实测：加它之后
        # test-reports/results.json 不再生成），所以探针这一步不产出 JSON 报告 —— 主 E2E 那份
        # 报告不会被它抢先写掉，主步一份都没产出时汇总步能如实报「没找到报告」（#1107）。
        run: |
          xvfb-run --auto-servernum \
            npx playwright test --config=playwright.config.ts --project=electron \
            --grep "AI Connectivity" --reporter=list
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Run Electron E2E
        # --workers=2 (#1107): ubuntu-latest runners are 4 vCPU, and each worker is a
        # full Electron app plus its Python bridge driving real LLM calls — 4 of them
        # leave the runner no headroom, which surfaces as actionability timeouts at
        # random spec points (first attempt fails, retry passes) and the job still
        # reports success.  Same parallelism as the macOS job below, for the same reason.
        #
        # This is load reduction, not a cure: the macOS job has run 2 workers for a
        # while and still has flaky runs.  The other half of #1107 is the next step,
        # which makes whatever flakiness remains visible instead of silent.
        #
        # Halving parallelism roughly doubles wall clock (the full suite takes 15-20
        # min at 4 workers, 199-233 tests), so the step timeout goes 30 -> 60 min: a
        # 2-worker run lands somewhere in the 30-40 min range, and the estimate has
        # not been confirmed by a real CI run yet.
        run: |
          xvfb-run --auto-servernum \
            npx playwright test --config=playwright.config.ts --project=electron \
            --workers=2
        timeout-minutes: 60
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Summarize flaky E2E tests
        # #1107：flaky 清单就地汇总，报告**不离开这个 job**。两个理由：
        # 1) 上传 artifact / release asset 都会把「内容由 PR 决定」的字节送到公开位置（报告里的
        #    字段来自 PR 检出的 playwright.config.ts 与 spec），等于给任意 PR 一条把 runner 上
        #    文件（例如 ~/.miqi/config.json）公开出去的通道；
        # 2) pull_request_target 下**只跑 base 分支这份脚本的可信副本**，PR 改不到它，步骤里
        #    因此不执行任何 PR 代码；base 里还没有这个脚本（本 PR 自己的运行）就跳过。
        # push / workflow_dispatch 的运行，检出的代码就是仓库自己的，直接用。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            trusted_script="/tmp/e2e-flaky-report.mjs"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/apps/desktop/scripts/e2e-flaky-report.mjs?ref=${{ github.event.pull_request.base.sha }}" \
              > "$trusted_script" 2>/dev/null || true
            if [ ! -s "$trusted_script" ]; then
              echo "跳过 flaky 汇总：base 分支里还没有 scripts/e2e-flaky-report.mjs（本 PR 自己的运行就是这种情况）"
              exit 0
            fi
            node "$trusted_script" test-reports/results.json
          else
            node scripts/e2e-flaky-report.mjs test-reports/results.json
          fi


      - name: Upload Playwright report (E2E)
        # 只在 push（develop 等仓库自己的分支，代码可信）的运行里留存失败产物：test-results/
        # 的内容由 PR 控制的测试进程写出，而这些进程是在 provider 凭据落到 ~/.miqi/config.json
        # **之后**跑的 —— 对 pull_request_target 的运行上传，等于给任意 PR 一条把 runner 上
        # 文件公开出去的通道（artifact 对仓库读者可下载）。PR 运行的失败详情仍在作业日志里。
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: apps/desktop/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 3: macOS Electron E2E — 完整 macOS 桌面应用 + bridge + LLM
  # ────────────────────────────────────────────────────────────
  macos-e2e:
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-macos-e2e
      cancel-in-progress: true
    runs-on: macos-latest
    # 同 Linux：只保留最小只读权限 + artifact 写入，release asset 上传交给独立 job。
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # 本 job 在凭据落盘后执行 PR 检出的代码（spec / 构建脚本），checkout 默认会把 job
          # token 写进 .git/config —— 别把它交给 PR 代码（CodeRabbit 安全评审 #1107）。
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install uv
          uv sync

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build renderer
        run: npm run build -- --logLevel warn

      - name: Generate config.json
        run: |
          mkdir -p ~/.miqi
          cat > ~/.miqi/config.json << 'CONFEOF'
          {
            "providers": {
              "siliconflow": {
                "apiKey": "${{ secrets.DEEPSEEK_API_KEY }}",
                "apiBase": "${{ secrets.DEEPSEEK_API_BASE }}",
                "extraHeaders": null
              }
            },
            "agents": {
              "defaults": {
                "model": "deepseek-v4-pro",
                "maxTokens": 8000,
                "temperature": 0.1,
                "maxToolIterations": 10,
                "runtime": "app_server"
              },
              "commandApproval": { "enabled": false }
            },
            "tools": {
              "web": {
                "search": {
                  "provider": "brave",
                  "apiKey": "${{ secrets.BRAVE_API_KEY }}",
                  "maxResults": 3
                },
                "fetch": { "provider": "builtin" }
              },
              "exec": { "timeout": 30, "envPassthrough": [] }
            }
          }
          CONFEOF

      - name: AI connectivity probe (macOS) — fail fast if provider unreachable
        # 同 Linux 侧：--reporter=list 让探针不产出 JSON 报告，不占用主 E2E 那份（#1107）。
        run: |
          npx playwright test --config=playwright.config.ts --project=electron \
            --grep "AI Connectivity" --reporter=list
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Run Electron E2E (macOS)
        # --workers=2: macos-latest runners (3 vCPU) can't sustain 4 parallel
        # Electron instances + LLM calls — overloaded runners cause intermittent
        # failures at random spec points (actionability misjudgements, slow
        # first sessions.list, sandbox timeouts).  Halving parallelism made the
        # suite stable without changing test semantics.
        #
        # --grep-invert also drops describe blocks that burn the most wall-clock
        # on macOS so the job stays under ~15 min:
        #   - sandbox-only suites (Sandbox Toggle / Sandbox toggle ready /
        #     Workspace Switch E2E (Sandbox ON)): no bubblewrap on macOS, so they
        #     wait waitForSandboxReady(300s) + LLM retries before failing.
        #   - heaviest LLM suites (Native Electron E2E / Feedback Page E2E /
        #     Execution Policy E2E): 34 long streaming tests that double the run.
        # Both are fully covered by the Linux electron-e2e job, which runs the
        # whole suite.
        #
        # --workers=2 cut the flakiness down but did not remove it — a 6-run sample
        # still had 0-2 flaky specs per run, with repeated hits on the same test
        # (task-assets.spec.ts:143, which looks deterministic rather than
        # load-induced).  That is why the summarize step below exists instead of
        # another round of parallelism tuning.
        run: |
          npx playwright test --config=playwright.config.ts --project=electron \
            --grep-invert "Sandbox Exec|Sandbox Toggle|Sandbox toggle ready|Workspace Switch E2E \(Sandbox ON\)|session-key-mapping|PPTX Generator|Native Electron E2E|Feedback Page E2E|Execution Policy E2E" \
            --workers=2
        timeout-minutes: 45
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'

      - name: Summarize flaky E2E tests (macOS)
        # #1107：flaky 清单就地汇总，报告**不离开这个 job**。两个理由：
        # 1) 上传 artifact / release asset 都会把「内容由 PR 决定」的字节送到公开位置（报告里的
        #    字段来自 PR 检出的 playwright.config.ts 与 spec），等于给任意 PR 一条把 runner 上
        #    文件（例如 ~/.miqi/config.json）公开出去的通道；
        # 2) pull_request_target 下**只跑 base 分支这份脚本的可信副本**，PR 改不到它，步骤里
        #    因此不执行任何 PR 代码；base 里还没有这个脚本（本 PR 自己的运行）就跳过。
        # push / workflow_dispatch 的运行，检出的代码就是仓库自己的，直接用。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            trusted_script="/tmp/e2e-flaky-report.mjs"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$GITHUB_REPOSITORY/contents/apps/desktop/scripts/e2e-flaky-report.mjs?ref=${{ github.event.pull_request.base.sha }}" \
              > "$trusted_script" 2>/dev/null || true
            if [ ! -s "$trusted_script" ]; then
              echo "跳过 flaky 汇总：base 分支里还没有 scripts/e2e-flaky-report.mjs（本 PR 自己的运行就是这种情况）"
              exit 0
            fi
            node "$trusted_script" test-reports/results.json
          else
            node scripts/e2e-flaky-report.mjs test-reports/results.json
          fi


      - name: Upload Playwright report (macOS E2E)
        # 同 Linux 侧：只在 push（代码可信）的运行里留存，pull_request_target 下不上传
        # PR 可控的 test-results/（见上面那段的说明）。
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos-e2e
          path: apps/desktop/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # macOS 打包（dmg/zip）不在这里跑：每个 PR 都起 macos runner 成本高，
  # 产物也没有下游消费方。发版时由 release.yml 的 build-mac 构建并上传 release。
  # ────────────────────────────────────────────────────────────
