name: Weekly Release (develop into main)

# 每周五 00:00 (Asia/Shanghai = 前一天周四 16:00 UTC) 自动创建并立即合并 develop → main 的发布 PR，
# 合并产生的 main push 由 release.yml 触发 semantic-release 发版与打包。
# 也可在 Actions 页手动触发（dry_run 只建 PR 不合并）。
on:
  schedule:
    - cron: '0 16 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只创建 PR，不自动合并'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check for commits to release
        id: check
        run: |
          git fetch origin develop main --tags
          # 排除反向同步产生的 chore(version) 标记提交（它只存在于 develop，不算待发布内容）
          git log --oneline origin/main..origin/develop --no-merges --invert-grep --grep='^chore(version):' > commits.txt
          if [ ! -s commits.txt ]; then
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::develop 上没有待发布的新提交，跳过本次发版"
          else
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "count=$(wc -l < commits.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse release PR
        if: steps.check.outputs.has_commits == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR=$(gh pr list --head develop --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            echo "::notice::已存在开放的发布 PR #$PR，直接复用"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            printf '## 类型\n\n- [x] 🔧 其他\n\n'
            printf '## 变更概述\n\n自动发布：合并 develop 到 main，触发 semantic-release 发版（每周自动发版流水线创建）。\n\n'
            printf '## 背景/问题\n\ndevelop 分支包含 %s 个尚未合入 main 的提交，本 PR 由每周五自动发版流水线创建并立即合并，随后由 release.yml 发布新版本并打包。\n\n' "${{ steps.check.outputs.count }}"
            printf '## 变更内容\n\n本次 develop → main 合并包含以下提交：\n\n'
            sed 's/^\([0-9a-f]\{7,\}\) /- `\1` /' commits.txt
            printf '\n## 日志/验证证据\n\n```\n$ git log --oneline origin/main..origin/develop --no-merges --invert-grep --grep="^chore(version):"\n'
            cat commits.txt
            printf '```\n\n'
            printf '## 测试情况\n\n- 上述每个提交均已在各自 PR 中通过 CI 后合入 develop\n- 合并后由 release.yml 执行 semantic-release 与 Win/macOS 打包\n\n'
            printf '## 截图\n\n无界面变更（自动发布同步 PR）。\n'
          } > body.md

          PR=$(gh pr create --base main --head develop \
            --title "chore(release): merge develop into main" \
            --body-file body.md)
          echo "number=${PR##*/}" >> "$GITHUB_OUTPUT"
          echo "::notice::已创建发布 PR #${PR##*/}"

      - name: Merge release PR
        if: steps.check.outputs.has_commits == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NUMBER="${{ steps.pr.outputs.number }}"
          merged=false
          for i in 1 2 3 4 5; do
            if gh pr merge "$NUMBER" --merge; then merged=true; break; fi
            echo "合并暂不可用（第 $i 次），10s 后重试..."
            sleep 10
          done
          if [ "$merged" != true ]; then
            echo "::error::自动合并 PR #$NUMBER 失败，请手动查看（冲突、权限或分支规则集限制）"
            exit 1
          fi
          echo "::notice::已合并发布 PR #$NUMBER，release.yml 将开始发版"

      - name: Dry run notice
        if: steps.check.outputs.has_commits == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "::notice::dry_run 模式：仅创建 PR #${{ steps.pr.outputs.number }}，未合并"
