name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.SIXIANGJIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Post each review as a fresh comment and publish code suggestions
          # as inline diff comments — instead of collapsing everything into a
          # single persistent comment that's easy to miss.
          # NOTE: env keys map to the [pr_reviewer] TOML section via dynaconf
          # (SECTION.KEY), so the correct names are PR_REVIEWER.* — NOT
          # github_action_config.pr_reviewer.* (which dynaconf ignores).
          PR_REVIEWER.PERSISTENT_COMMENT: "false"
          PR_REVIEWER.INLINE_CODE_COMMENTS: "true"
          # Append the auto-generated description to the existing PR body
          # instead of REPLACING it — the PR template sections (## 变更概述 /
          # ## 日志/验证证据 / ...) get wiped on every push otherwise, and the
          # validate job (pr-template-check) keeps failing (PR-Agent body 循环).
          PR_DESCRIPTION.ADD_DESCRIPTION: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review", "review_requested"]'
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review", "/describe", "/improve"]'
          config.model: "openai/deepseek-v4-flash"
          config.fallback_models: '["openai/deepseek-v4-flash"]'
          config.custom_model_max_tokens: "128000"
          config.max_model_tokens: "128000"
          config.reasoning_effort: "xhigh"
          config.ai_timeout: "600"
          OPENAI.API_BASE: "https://new.sixiangjia.de/v1"
