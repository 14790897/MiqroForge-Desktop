name: Release and Build

# push 到 main：正式发版 + 打包 Win/macOS（main 的 push 来自 weekly-release.yml 的发布 PR 或手动合并）
# push 到 develop：只发 x.y.z-dev.N 的 GitHub Prerelease（不写文件、不打包），见 release.config.cjs
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# 同一分支上串行执行：develop 连续推送时避免两轮 semantic-release 抢同一个预发布版本号
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Semantic Release ────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Snapshot latest release tag (before)
        id: before
        run: |
          TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release

      - name: Detect new release
        id: check
        run: |
          # 只认本次运行在 HEAD 上打的 tag：concurrency 是按分支分组的，develop 与 main 可以同时在跑，
          # 用 gh release list 取「仓库最新 release」会拿到另一个分支刚发的版本，导致打包被误跳过
          # （main 的正式版本被 develop 的预发布顶掉 → prerelease=true → 不打包）。
          TAG=$(git tag --points-at HEAD | sort -V | tail -1)
          BEFORE="${{ steps.before.outputs.tag }}"
          if [ -n "$TAG" ] && [ "$TAG" != "$BEFORE" ]; then
            # 按 tag 查这个 release 本身的 prerelease 标记（不是查「最新 release」，所以没有并发问题）
            PRERELEASE=$(gh release view "$TAG" --json isPrerelease -q '.isPrerelease' 2>/dev/null)
            if [ -z "$PRERELEASE" ]; then
              # 查询失败时按语义化版本兜底：vX.Y.Z 无预发布号，vX.Y.Z-dev.N 有（'-' 之后即预发布号）
              case "$TAG" in
                *-*) PRERELEASE=true ;;
                *) PRERELEASE=false ;;
              esac
              echo "::warning::gh release view $TAG 失败，按 tag 名判断 prerelease=$PRERELEASE"
            fi
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
            echo "::notice::New release created: $TAG (was: $BEFORE, prerelease: $PRERELEASE)"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new release (tag on HEAD: ${TAG:-none}; latest before: ${BEFORE:-none})"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Build Desktop App (Windows) ────────────────────────────
  build-win:
    needs: release
    if: needs.release.outputs.new_release == 'true' && needs.release.outputs.prerelease != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Build miqi-bridge.exe
        run: uv run pyinstaller miqi.spec

      - name: Install Electron dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app
        working-directory: apps/desktop
        run: npm run build

      - name: Package Electron app
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            dist-new/*.exe
            dist-new/*.msi
            dist-new/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Build Desktop App (macOS) ─────────────────────────────
  build-mac:
    needs: release
    if: needs.release.outputs.new_release == 'true' && needs.release.outputs.prerelease != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Build miqi-bridge
        run: uv run pyinstaller miqi.spec

      - name: Install Electron dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app
        working-directory: apps/desktop
        run: npm run build

      - name: Package Electron app
        working-directory: apps/desktop
        run: npx electron-builder --mac --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            dist-new/*.dmg
            dist-new/*-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
